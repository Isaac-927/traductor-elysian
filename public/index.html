<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elysian Translations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-a: #eef2ff;
        --bg-b: #f5f7ff;
        --panel: #ffffff;
        --line: #dde3fb;
        --ink: #101534;
        --ink-soft: #5c6389;
        --electric: #2251ff;
        --electric-soft: #e3eaff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 100%);
        color: var(--ink);
        font-family:
          "Inter",
          -apple-system,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 20px;
        min-height: 100vh;
      }

      .app {
        width: 100%;
        max-width: 880px;
      }

      header {
        margin-bottom: 28px;
        text-align: center;
      }

      .logo {
        max-width: 260px;
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 6px;
      }

      .subtitle {
        font-size: 14px;
        color: var(--ink-soft);
        margin: 0;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      select {
        appearance: none;
        font-family: "Fredoka", "Inter", sans-serif;
        border: none;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
        border-radius: 999px;
      }
      #idiomaOrigen,
      #idiomaDestino {
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
      }
      #idiomaOrigen:hover,
      #idiomaDestino:hover {
        background: #f5f6fb;
      }
      select:focus-visible {
        outline: 2px solid var(--ink);
      }

      .bar-left,
      .bar-right {
        flex: 1;
      }
      .bar-right {
        display: flex;
        justify-content: flex-end;
      }

      .swap {
        border: 1px solid var(--line);
        background: var(--panel);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--ink-soft);
        flex-shrink: 0;
        transition:
          transform 0.2s ease,
          color 0.15s ease;
      }
      .swap:hover {
        color: var(--ink);
        transform: scale(1.07);
      }
      .swap:active {
        transform: rotate(180deg);
      }
      .swap:focus-visible {
        outline: 2px solid var(--ink);
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: var(--panel);
        box-shadow:
          0 4px 12px rgba(16, 21, 52, 0.06),
          0 14px 32px rgba(16, 21, 52, 0.08);
      }

      .panel {
        position: relative;
        min-height: 220px;
        padding: 22px 22px 58px;
      }
      .panel.source {
        border-right: 1px solid var(--line);
      }
      .panel.target {
        background: #f8f9ff;
      }

      textarea {
        width: 100%;
        height: 150px;
        border: none;
        resize: none;
        background: transparent;
        font-size: 19px;
        line-height: 1.5;
        color: var(--ink);
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
      }
      textarea::placeholder {
        color: #a9b1d6;
      }

      .output {
        font-size: 19px;
        line-height: 1.5;
        color: var(--ink);
        white-space: pre-wrap;
        min-height: 150px;
        transition: opacity 0.15s ease;
      }
      .output.placeholder {
        color: #a9b1d6;
      }

      .panel-footer {
        position: absolute;
        bottom: 14px;
        left: 22px;
        right: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mic-btn {
        border: none;
        background: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-soft);
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .mic-btn:hover {
        background: #eef0f8;
        color: var(--ink);
      }
      .mic-btn.listening {
        color: #fff;
        background: var(--electric);
        animation: pulse 1.4s infinite;
      }
      .mic-btn.listening:hover {
        background: var(--electric);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(34, 81, 255, 0.35);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(34, 81, 255, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 81, 255, 0);
        }
      }

      .status {
        font-size: 13px;
        color: var(--ink-soft);
        min-height: 16px;
      }

      .char-count {
        font-size: 13px;
        color: var(--ink-soft);
      }

      @media (max-width: 620px) {
        .panels {
          grid-template-columns: 1fr;
        }
        .panel.source {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <img src="logo.jpg" alt="Elysian Translations" class="logo" />
        <p class="subtitle">Más de 20 idiomas</p>
      </header>

      <div class="bar">
        <div class="bar-left">
          <select id="idiomaOrigen"></select>
        </div>

        <button
          class="swap"
          id="btnSwap"
          title="Invertir idiomas"
          aria-label="Invertir idiomas"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>

        <div class="bar-right">
          <select id="idiomaDestino"></select>
        </div>
      </div>

      <div class="panels">
        <div class="panel source">
          <textarea
            id="textoOrigen"
            placeholder="Escribe o habla..."
          ></textarea>
          <div class="panel-footer">
            <button
              class="mic-btn"
              id="btnMic"
              title="Hablar"
              aria-label="Hablar"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
                ></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <span class="char-count" id="charCount"></span>
          </div>
        </div>

        <div class="panel target">
          <div class="output placeholder" id="textoDestino">Traducción</div>
          <div class="panel-footer">
            <button
              class="mic-btn"
              id="btnEscuchar"
              title="Escuchar traducción"
              aria-label="Escuchar traducción"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </button>
            <span class="status" id="estado"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const textoOrigen = document.getElementById("textoOrigen");
      const textoDestino = document.getElementById("textoDestino");
      const idiomaOrigen = document.getElementById("idiomaOrigen");
      const idiomaDestino = document.getElementById("idiomaDestino");
      const estado = document.getElementById("estado");
      const charCount = document.getElementById("charCount");
      const btnMic = document.getElementById("btnMic");
      const btnSwap = document.getElementById("btnSwap");

      const IDIOMAS = [
        { code: "EN", targetCode: "EN-US", label: "Inglés", voz: "en-US" },
        { code: "ES", targetCode: "ES", label: "Español", voz: "es-ES" },
        { code: "IT", targetCode: "IT", label: "Italiano", voz: "it-IT" },
        { code: "FR", targetCode: "FR", label: "Francés", voz: "fr-FR" },
        { code: "DE", targetCode: "DE", label: "Alemán", voz: "de-DE" },
        { code: "PT", targetCode: "PT-BR", label: "Portugués", voz: "pt-BR" },
        { code: "NL", targetCode: "NL", label: "Neerlandés", voz: "nl-NL" },
        { code: "PL", targetCode: "PL", label: "Polaco", voz: "pl-PL" },
        { code: "RU", targetCode: "RU", label: "Ruso", voz: "ru-RU" },
        { code: "JA", targetCode: "JA", label: "Japonés", voz: "ja-JP" },
        { code: "KO", targetCode: "KO", label: "Coreano", voz: "ko-KR" },
        { code: "ZH", targetCode: "ZH-HANS", label: "Chino", voz: "zh-CN" },
        { code: "AR", targetCode: "AR", label: "Árabe", voz: "ar-SA" },
        { code: "TR", targetCode: "TR", label: "Turco", voz: "tr-TR" },
        { code: "SV", targetCode: "SV", label: "Sueco", voz: "sv-SE" },
        { code: "DA", targetCode: "DA", label: "Danés", voz: "da-DK" },
        { code: "NB", targetCode: "NB", label: "Noruego", voz: "nb-NO" },
        { code: "FI", targetCode: "FI", label: "Finlandés", voz: "fi-FI" },
        { code: "EL", targetCode: "EL", label: "Griego", voz: "el-GR" },
        { code: "CS", targetCode: "CS", label: "Checo", voz: "cs-CZ" },
        { code: "RO", targetCode: "RO", label: "Rumano", voz: "ro-RO" },
        { code: "HU", targetCode: "HU", label: "Húngaro", voz: "hu-HU" },
        { code: "BG", targetCode: "BG", label: "Búlgaro", voz: "bg-BG" },
        { code: "UK", targetCode: "UK", label: "Ucraniano", voz: "uk-UA" },
        { code: "ID", targetCode: "ID", label: "Indonesio", voz: "id-ID" },
      ];
      IDIOMAS.sort((a, b) => a.label.localeCompare(b.label, "es"));

      idiomaOrigen.innerHTML =
        `<option value="AUTO">Detectar idioma</option>` +
        IDIOMAS.map(
          (l) => `<option value="${l.code}">${l.label}</option>`,
        ).join("");

      idiomaDestino.innerHTML = IDIOMAS.map(
        (l) => `<option value="${l.targetCode}">${l.label}</option>`,
      ).join("");
      idiomaDestino.value = "ES";

      let debounceTimer = null;

      textoOrigen.addEventListener("input", () => {
        charCount.textContent = textoOrigen.value.length
          ? `${textoOrigen.value.length} caracteres`
          : "";
        clearTimeout(debounceTimer);
        const texto = textoOrigen.value.trim();

        if (!texto) {
          textoDestino.textContent = "Traducción";
          textoDestino.classList.add("placeholder");
          estado.textContent = "";
          return;
        }

        debounceTimer = setTimeout(() => traducir(texto), 500);
      });

      idiomaDestino.addEventListener("change", () => {
        if (textoOrigen.value.trim()) traducir(textoOrigen.value.trim());
      });

      idiomaOrigen.addEventListener("change", () => {
        if (textoOrigen.value.trim()) traducir(textoOrigen.value.trim());
      });

      btnSwap.addEventListener("click", () => {
        if (idiomaOrigen.value === "AUTO") return;

        const origenActual = idiomaOrigen.value;
        const destinoActual = idiomaDestino.value;

        const nuevoOrigen = IDIOMAS.find((l) => l.targetCode === destinoActual);

        const nuevoDestino = IDIOMAS.find((l) => l.code === origenActual);

        idiomaOrigen.value = nuevoOrigen ? nuevoOrigen.code : "AUTO";
        idiomaDestino.value = nuevoDestino
          ? nuevoDestino.targetCode
          : destinoActual;

        if (textoOrigen.value.trim()) traducir(textoOrigen.value.trim());
      });

      async function traducir(texto) {
        estado.textContent = "Traduciendo...";
        try {
          const res = await fetch("http://localhost:3000/traducir", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              texto,
              idiomaDestino: idiomaDestino.value,
              idiomaOrigen:
                idiomaOrigen.value === "AUTO" ? null : idiomaOrigen.value,
            }),
          });
          const data = await res.json();
          if (data.error) {
            textoDestino.textContent = "Error: " + data.error;
          } else {
            textoDestino.textContent = data.traduccion;
            textoDestino.classList.remove("placeholder");
          }
        } catch (err) {
          textoDestino.textContent =
            "No se pudo conectar al servidor (¿está corriendo node server.js?)";
        }
        estado.textContent = "";
      }

      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;
      let escuchando = false;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const texto = event.results[0][0].transcript;
          textoOrigen.value = texto;
          charCount.textContent = `${texto.length} caracteres`;
          traducir(texto);
        };

        recognition.onerror = (event) => {
          estado.textContent = "Error de micrófono: " + event.error;
        };

        recognition.onend = () => {
          escuchando = false;
          btnMic.classList.remove("listening");
        };
      }

      btnMic.addEventListener("click", () => {
        if (!SpeechRecognition) {
          alert(
            "Tu navegador no soporta reconocimiento de voz. Prueba con Chrome.",
          );
          return;
        }

        if (escuchando) {
          recognition.stop();
          return;
        }

        const idiomaSeleccionado = IDIOMAS.find(
          (l) => l.code === idiomaOrigen.value,
        );
        recognition.lang = idiomaSeleccionado
          ? idiomaSeleccionado.voz
          : "en-US";

        escuchando = true;
        btnMic.classList.add("listening");
        estado.textContent = "Escuchando...";
        recognition.start();
      });

      const btnEscuchar = document.getElementById("btnEscuchar");

      btnEscuchar.addEventListener("click", () => {
        if (!("speechSynthesis" in window)) {
          alert("Tu navegador no soporta lectura en voz alta.");
          return;
        }

        const texto = textoDestino.textContent;
        if (!texto || textoDestino.classList.contains("placeholder")) return;

        speechSynthesis.cancel();

        const idiomaDest = IDIOMAS.find(
          (l) => l.targetCode === idiomaDestino.value,
        );
        const lang = idiomaDest ? idiomaDest.voz : "es-ES";

        const voces = speechSynthesis.getVoices();
        const prefijo = lang.split("-")[0];
        const hayVoz = voces.some((v) =>
          v.lang.toLowerCase().startsWith(prefijo),
        );

        if (voces.length > 0 && !hayVoz) {
          estado.textContent = `Tu computadora no tiene una voz instalada para "${idiomaDest ? idiomaDest.label : lang}"`;
          return;
        }

        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = lang;
        speechSynthesis.speak(utterance);
      });
    </script>
  </body>
</html>
